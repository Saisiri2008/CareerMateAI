<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - CareerMate AI</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            CareerMate <span>AI</span>
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

        </div>

    </nav>



    <!-- Login Section -->

    <section class="login-section">


        <div class="login-card">


            <div class="login-icon">
                🤖
            </div>


            <h1>
                Welcome Back!
            </h1>


            <p>
                Login to continue your CareerMate AI journey.
            </p>



            <!-- Login Form -->

            <form id="loginForm">


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>



                <button
                    type="submit"
                    class="login-submit">

                    Login →

                </button>


            </form>


            <p class="demo-text">

                Demo Login: Use any email and password

            </p>


        </div>


    </section>



    <script src="js/login.js"></script>

</body>

</html>
